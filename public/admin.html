<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration · Cheeesy</title>
<link id="favicon" rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <h1>Administration</h1>
    <label>Code PIN <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" autofocus></label>
    <button class="btn primary" type="submit">Entrer</button>
    <p id="loginError" class="error"></p>
    <a href="/" class="back-link">← Retour à la borne</a>
  </form>
</div>

<div id="shell" class="shell hidden">
  <!-- Téléphone : barre fine en haut, le menu s'ouvre en tiroir par-dessus -->
  <header class="topbar">
    <button id="navToggle" class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <span id="topTitle" class="top-title"></span>
  </header>
  <nav id="nav" class="nav">
    <div class="nav-title">Cheeesy</div>
    <a href="#dashboard" class="active">Tableau de bord</a>
    <a href="#sessions">Événements &amp; photos</a>
    <a href="#templates">Templates</a>
    <div class="nav-group">Réglages</div>
    <a href="#flow">Parcours invité</a>
    <a href="#printing">Impression</a>
    <a href="#sharing">Galerie &amp; partage</a>
    <a href="#theme">Apparence</a>
    <a href="#texts">Textes des écrans</a>
    <a href="#camera">Appareil photo</a>
    <a href="#control">Écran &amp; contrôle</a>
    <a href="#lights">Lumières</a>
    <a href="#security">Sécurité</a>
    <div class="nav-foot">
      <button id="btnBooth" class="btn primary small">← Retour à la borne</button>
      <button id="btnLogout" class="btn ghost small">Déconnexion</button>
      <button id="btnRestart" class="btn ghost small hidden">Redémarrer la borne</button>
      <button id="btnShutdown" class="btn danger small hidden">Éteindre la borne</button>
    </div>
  </nav>
  <div id="navBackdrop" class="nav-backdrop"></div>
  <main id="main" class="main"></main>
</div>
<!-- Enregistrement automatique : « Enregistrement… » puis « Enregistré » -->
<div id="saveState" class="save-state" aria-live="polite"></div>

<div id="toast" class="toast hidden"></div>
<!-- Confirmation dans la page (et non confirm()) : se valide aussi depuis le Stream Deck -->
<dialog id="confirmDialog" class="confirm-dialog">
  <p id="confirmText"></p>
  <div class="row"><button id="cfCancel" class="btn" type="button">Annuler</button><button id="cfOk" class="btn danger" type="button"></button></div>
</dialog>
<script type="module" src="/admin.js"></script>
</body>
</html>
